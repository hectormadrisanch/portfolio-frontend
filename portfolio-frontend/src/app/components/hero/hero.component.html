<section class="hero" id="home">
  <div class="hero__inner">
    <p class="hero__status">
      <span class="hero__dot" aria-hidden="true"></span>
      {{ ts.t().hero.status }}
    </p>

    <p class="hero__greeting">{{ ts.t().hero.greeting }}</p>

    <h1 class="hero__title">{{ ts.t().hero.title }}</h1>

    <p class="hero__description">{{ ts.t().hero.description }}</p>

    <div class="hero__actions">
      <a class="btn btn--primary" [routerLink]="['/']" fragment="projects">
        {{ ts.t().hero.ctaPrimary }}
        <span aria-hidden="true">→</span>
      </a>
      <a class="btn btn--ghost" [routerLink]="['/']" fragment="contact">
        {{ ts.t().hero.ctaSecondary }}
      </a>
    </div>
  </div>
</section>
